<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0b1424"><title>MY INVEST</title><style>*{box-sizing:border-box}body{margin:0;background:#09111e;color:#eef5ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:650px;margin:auto;padding:22px 18px 110px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px}h1{font-size:22px;letter-spacing:2px;margin:0}.sub{color:#91a2b9;font-size:12px}.card{background:#152338;border:1px solid #263750;border-radius:20px;padding:20px;margin:14px 0}.big{font-size:34px;font-weight:750;letter-spacing:-1px;margin:12px 0}.green{color:#58d9b1}.red{color:#ff8790}.row{display:flex;justify-content:space-between;align-items:center;gap:12px}.muted{color:#a4b3c8}.label{font-size:13px;color:#a4b3c8}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.grid .card{margin:0}.value{font-size:19px;font-weight:700;margin-top:8px}nav{position:fixed;bottom:0;left:0;right:0;background:#101d30;border-top:1px solid #2a3a51;display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}nav button{flex:1;max-width:130px;padding:15px 2px;border:0;background:transparent;color:#91a2b9;font-size:11px}nav button.active{color:#5ee2bd;font-weight:700}button{cursor:pointer}button.primary{background:#58d9b1;color:#071b21;border:0;border-radius:12px;padding:12px 16px;font-weight:700}button.ghost{background:#263b53;color:#eaf4ff;border:0;border-radius:10px;padding:9px 12px}input,select{width:100%;background:#0e1b2c;color:white;border:1px solid #3b4c62;border-radius:10px;padding:12px;font-size:16px}label{display:block;color:#a4b3c8;font-size:12px;margin:12px 0 5px}.hide{display:none}.bar{height:12px;background:#2d4059;border-radius:10px;overflow:hidden;margin:9px 0}.bar span{display:block;height:100%;background:#58d9b1}.item{padding:14px 0;border-bottom:1px solid #2a3c53}.item:last-child{border:0}.pill{border-radius:20px;background:#27483f;color:#6aefc6;padding:5px 9px;font-size:12px}.note{font-size:12px;color:#9aabc2;line-height:1.7}.chart{display:flex;align-items:end;gap:5px;height:105px;margin-top:15px}.chart div{flex:1;background:linear-gradient(#65e2be,#256d71);border-radius:4px 4px 0 0;min-height:3px}h2{font-size:20px;margin:24px 0 14px}.divider{border-top:1px solid #2a3c53;margin:16px 0}</style></head><body><main><header><div><h1>MY INVEST <span style="color:#58d9b1">●</span></h1><div class="sub">PERSONAL WEALTH DASHBOARD</div></div><span class="pill">PRIVATE</span></header><section id="home"></section><section id="assets" class="hide"></section><section id="fire" class="hide"><div style="padding:14px;background:#163e46;border-radius:14px;margin:12px 0"><b>40歳FIRE詳細計画</b><p style="font-size:13px;color:#b9d2db">税金・インフレ・年次キャッシュフロー・暴落比較に対応</p><a href="fire-plan.html" style="display:block;text-align:center;background:#35cba9;color:#082421;padding:13px;border-radius:12px;font-weight:700;text-decoration:none">詳細FIREプランを開く →</a></div></section><section id="income" class="hide"></section><section id="analysis" class="hide"></section></main><nav><button data-tab="home" class="active">⌂<br>ホーム</button><button data-tab="assets">▤<br>資産・株価</button><button data-tab="fire">◷<br>FIRE</button><button data-tab="income">¥<br>配当</button><button data-tab="analysis">◎<br>分析</button></nav><script>
const initial=[{name:'現金',type:'現金',value:1000000,cost:1000000,div:0},{name:'暗号資産',type:'暗号資産',value:500000,cost:500000,div:0},{name:'S&P500',type:'投資信託',value:5000000,cost:5000000,div:0},{name:'総医研',type:'日本株',value:3000000,cost:3000000,div:0},{name:'ソフトバンクG',type:'日本株',value:3000000,cost:3000000,div:0},{name:'任天堂',type:'日本株',value:2000000,cost:2000000,div:0},{name:'NTT',type:'日本株',value:2000000,cost:2000000,div:0},{name:'トヨタ',type:'日本株',value:2000000,cost:2000000,div:0}];
const storage={getItem(k){try{return localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{localStorage.setItem(k,v)}catch(e){}}};const get=(k,d)=>{try{let v=JSON.parse(storage.getItem(k));return v??d}catch{return d}};let holdings=get('myinvest_holdings',initial),settings=get('myinvest_settings',{age:31,retire:40,spend:300000,monthly:100000,returnRate:4,inflation:2,years:50});const save=()=>{storage.setItem('myinvest_holdings',JSON.stringify(holdings));storage.setItem('myinvest_settings',JSON.stringify(settings))};const yen=n=>'¥'+Math.round(n).toLocaleString('ja-JP');const pct=n=>(n>=0?'+':'')+n.toFixed(1)+'%';const total=()=>holdings.reduce((a,x)=>a+x.value,0);const cost=()=>holdings.reduce((a,x)=>a+x.cost,0);const dividend=()=>holdings.reduce((a,x)=>a+(x.div||0),0);const el=id=>document.getElementById(id);const card=s=>'<div class="card">'+s+'</div>';const rate=()=>Math.max(-0.99,settings.returnRate/100);function project(){let balance=total(),data=[balance];for(let age=settings.age+1;age<=settings.age+settings.years;age++){let infl=Math.pow(1+settings.inflation/100,age-settings.age);let withdrawal=age>settings.retire?settings.spend*12*infl:0;let contribution=age<=settings.retire?settings.monthly*12:0;balance=Math.max(0,balance*(1+rate())+contribution-withdrawal);data.push(balance)}return data}function field(id,title,value,step=1){return `<label for="${id}">${title}</label><input id="${id}" type="number" step="${step}" value="${value}">`};function render(){let t=total(),p=t-cost(),dp=dividend(),pr=project(),retireIndex=Math.max(0,settings.retire-settings.age),retireValue=pr[retireIndex]??t;el('home').innerHTML=card(`<div class="label">現在の総資産 <span class="pill">手入力データ</span></div><div class="big">${yen(t)}</div><div class="row"><span class="${p>=0?'green':'red'}">評価損益 ${yen(p)} (${pct(cost()?p/cost()*100:0)})</span></div><div class="chart">${pr.slice(0,25).map(x=>`<div style="height:${Math.max(2,x/Math.max(...pr.slice(0,25),1)*100)}%"></div>`).join('')}</div><p class="note">将来資産の試算グラフ。実際の過去推移ではありません。</p>`)+`<div class="grid">${card(`<div class="label">年間配当（入力値）</div><div class="value">${yen(dp)}</div>`)}${card(`<div class="label">FIRE開始時の推計</div><div class="value">${yen(retireValue)}</div>`)}</div>`+card(`<h2>クイック分析</h2>${analysisText()}<p class="note">市場データを使わないルールベース分析です。</p>`);
el('assets').innerHTML=`<h2>資産・損益・株価チェック</h2><p class="note">価格は自動取得していません。現在評価額を手入力すると損益が更新されます。</p>`+card(holdings.map((x,i)=>`<div class="item"><div class="row"><b>${escapeHTML(x.name)}</b><span class="muted">${escapeHTML(x.type)}</span></div><div class="row" style="margin-top:8px"><strong>${yen(x.value)}</strong><span class="${x.value>=x.cost?'green':'red'}">${yen(x.value-x.cost)}</span></div><button class="ghost" style="margin-top:10px" onclick="editAsset(${i})">編集</button> <button class="ghost" onclick="deleteAsset(${i})">削除</button></div>`).join('')+`<button class="primary" onclick="editAsset(-1)">＋ 銘柄・資産を追加</button>`)+`<div id="assetForm"></div>`;
el('fire').innerHTML=`<h2>FIREシミュレーション</h2>`+card(`<div class="label">${settings.retire}歳時点の予想資産</div><div class="big">${yen(retireValue)}</div><div class="label">${settings.age+settings.years}歳時点の予想残高</div><div class="value">${yen(pr.at(-1))}</div><p class="${pr.at(-1)>0?'green':'red'}">${pr.some((v,i)=>i>retireIndex&&v<=0)?'試算期間内に資産が尽きる可能性':'試算期間末まで資産が残る計算'}</p><p class="note">年末に積立・生活費を反映する簡易計算。税・手数料・年ごとの変動は未考慮。</p>`)+card(field('age','現在の年齢',settings.age)+field('retire','FIRE開始年齢',settings.retire)+field('spend','現在の月間生活費（円）',settings.spend)+field('monthly','FIREまでの毎月積立（円）',settings.monthly)+field('returnRate','想定年利（%）',settings.returnRate,0.5)+field('inflation','物価上昇率（%）',settings.inflation,0.5)+field('years','試算期間（年）',settings.years)+`<button class="primary" style="margin-top:16px" onclick="updateSettings()">再計算</button>`);
el('income').innerHTML=`<h2>配当金管理</h2>`+card(`<div class="label">年間予想配当合計（税引前・手入力）</div><div class="big">${yen(dp)}</div><div class="label">月平均 ${yen(dp/12)}</div>`)+card((holdings.filter(x=>x.div>0).map(x=>`<div class="item row"><b>${escapeHTML(x.name)}</b><span class="green">${yen(x.div)}</span></div>`).join('')||'<p class="muted">まだ配当金が登録されていません。「資産・株価」から銘柄を編集して入力してください。</p>')+`<p class="note">支払月・税金は未反映です。</p>`);
let groups={};holdings.forEach(x=>groups[x.type]=(groups[x.type]||0)+x.value);el('analysis').innerHTML=`<h2>ポートフォリオ分析</h2>`+card(Object.entries(groups).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class="row"><span>${escapeHTML(k)}</span><b>${(v/(t||1)*100).toFixed(1)}%</b></div><div class="bar"><span style="width:${v/(t||1)*100}%"></span></div>`).join(''))+card(`<h2>投資分析レポート</h2>${analysisText()}<p class="note">これはAI APIを使用しない自動診断です。個別銘柄の売買推奨ではありません。</p>`);}
function analysisText(){let t=total(),jp=holdings.filter(x=>x.type==='日本株').reduce((a,x)=>a+x.value,0),cash=holdings.filter(x=>x.type==='現金').reduce((a,x)=>a+x.value,0),max=Math.max(...holdings.map(x=>x.value),0);return `<p>日本株の割合は <b>${(jp/(t||1)*100).toFixed(1)}%</b>。${jp/t>.5?'国内個別株への集中度が高めです。':'国内個別株への偏りを確認できます。'}</p><p>最大保有資産の割合は <b>${(max/(t||1)*100).toFixed(1)}%</b>。銘柄別の集中リスクを確認しましょう。</p><p>現金比率は <b>${(cash/(t||1)*100).toFixed(1)}%</b>。生活防衛資金が十分か、支出と比較しましょう。</p>`}function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}window.editAsset=i=>{let x=i<0?{name:'',type:'日本株',value:0,cost:0,div:0}:holdings[i];el('assetForm').innerHTML=card(`<h2>${i<0?'資産を追加':'資産を編集'}</h2><label>銘柄名</label><input id="aName" value="${escapeHTML(x.name)}"><label>資産種類</label><select id="aType">${['日本株','米国株','投資信託','現金','暗号資産','その他'].map(z=>`<option ${z===x.type?'selected':''}>${z}</option>`).join('')}</select>${field('aValue','現在の評価額（円）',x.value)}${field('aCost','取得額・投資元本（円）',x.cost)}${field('aDiv','年間予想配当（円・税引前）',x.div)}<button class="primary" style="margin-top:16px" onclick="saveAsset(${i})">保存する</button>`);el('assetForm').scrollIntoView({behavior:'smooth',block:'center'})};window.saveAsset=i=>{let x={name:el('aName').value.trim(),type:el('aType').value,value:+el('aValue').value,cost:+el('aCost').value,div:+el('aDiv').value};if(!x.name||[x.value,x.cost,x.div].some(n=>!Number.isFinite(n)||n<0)){alert('銘柄名と0以上の金額を入力してください');return}if(i<0)holdings.push(x);else holdings[i]=x;save();render()};window.deleteAsset=i=>{if(confirm('この資産を削除しますか？')){holdings.splice(i,1);save();render()}};window.updateSettings=()=>{let o={};for(let k of Object.keys(settings))o[k]=+el(k).value;if(Object.values(o).some(n=>!Number.isFinite(n))||o.age<0||o.retire<o.age||o.years<1||o.years>100||o.spend<0||o.monthly<0||o.returnRate<=-100||o.inflation<=-100){alert('入力値を確認してください');return}settings=o;save();render()};document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('main section').forEach(s=>s.classList.add('hide'));el(b.dataset.tab).classList.remove('hide');document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));b.classList.add('active');window.scrollTo(0,0)});render();</script></body></html>
